# 40-libinput.conf: Generic configuration for libinput touchpad
# Configures touchpad devices to use natural scrolling.
# Place this file in /etc/X11/xorg.conf.d to apply settings
# for touchpad devices detected via libinput.

Section "InputClass"
    Identifier "libinput touchpad catchall"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "NaturalScrolling" "True"
EndSection
