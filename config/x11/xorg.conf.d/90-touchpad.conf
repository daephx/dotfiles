# 90-touchpad.conf: Configuration for touchpad settings
# Enables tapping, natural scrolling, and custom button mappings.
# Place this file in /etc/X11/xorg.conf.d to apply settings for
# touchpad devices using the libinput driver.

Section "InputClass"
    Identifier "touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "true"
    # 1/2/3 finger, for 3-finger middle lrm
    Option "TappingButtonMap" "lrm"
EndSection
