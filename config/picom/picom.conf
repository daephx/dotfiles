# picom: X11 Window Compositor
# Documentation: https://github.com/yshui/picom/wiki
# Copyright (C) 2022 daephx

# Set logging verbosity
log-level = "warn";

# Enable window shadows
shadow = true;

# The blur radius for shadows, in pixels. (defaults to 12)
shadow-radius = 12;

# Enable rounded corners
round-borders = 1;
corner-radius = 6.0;

# Exclude windows from rounded corners
rounded-croners-exclude = [
  "class_g = 'i3bar'"
];

# Set window fade effects
fading = true;
fade-delta = 3
fade-in-step = 0.015;
fade-out-step = 0.1;

# Configure backends
experimental-backends = false;
backend = "glx";

vsync = false;
refresh-rate = 0;

# Handle window focus grouping
detect-transient = true;

# Set transperancy for specific windows
opacity-rule: [
  "85:class_g = 'Org.gnome.Nautilus'"
];

# ???
wintypes: {
  dock = { shadow = false; };
  dnd = { shadow = false; };
  tooltip = { shadow = false; };
  menu = { opacity = false; };
  dropdown_menu = { opacity = false; };
  popup_menu = { opacity = false; };
  utility = { opacity = false; };
};
